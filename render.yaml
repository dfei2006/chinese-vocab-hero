services:
  - type: web
    name: chinese-vocab-hero
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TTS_PROVIDER
        value: volcengine
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: VOLCENGINE_TTS_APP_ID
        sync: false
      - key: VOLCENGINE_TTS_ACCESS_KEY
        sync: false
      - key: VOLCENGINE_TTS_ACCESS_TOKEN
        sync: false
      - key: VOLCENGINE_TTS_RESOURCE_ID
        value: seed-tts-2.0
      - key: VOLCENGINE_TTS_VOICE_TYPE
        sync: false
      - key: VOLCENGINE_REALTIME_APP_ID
        sync: false
      - key: VOLCENGINE_REALTIME_ACCESS_TOKEN
        sync: false
      - key: VOLCENGINE_REALTIME_SPEAKER
        sync: false
